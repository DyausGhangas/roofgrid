AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RoofGrid API for AWS Lambda, API Gateway, and Amazon Bedrock

Parameters:
  RoofGridSecretArn:
    Type: String
    Description: ARN of a Secrets Manager secret containing CONTACT_EMAIL
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Browser origin allowed to call the API directly
  AiModel:
    Type: String
    Default: openai.gpt-oss-120b-1:0
    Description: Amazon Bedrock foundation model used by RoofGrid AI
  AiDailyRequestLimit:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Maximum Bedrock AI requests allowed per UTC day
  AiThrottleRate:
    Type: Number
    Default: 0.5
    MinValue: 0.1
    Description: Steady-state AI requests per second allowed by API Gateway
  AiThrottleBurstLimit:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Short AI request burst allowed by API Gateway

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 25
    Environment:
      Variables:
        ROOFGRID_SECRET_ARN: !Ref RoofGridSecretArn
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        AI_MODEL: !Ref AiModel
        AI_USAGE_TABLE: !Ref AiUsageTable
        AI_DAILY_REQUEST_LIMIT: !Ref AiDailyRequestLimit

Resources:
  RoofGridHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600
      RouteSettings:
        "POST /api/ai":
          ThrottlingBurstLimit: !Ref AiThrottleBurstLimit
          ThrottlingRateLimit: !Ref AiThrottleRate
        "POST /api/groq":
          ThrottlingBurstLimit: !Ref AiThrottleBurstLimit
          ThrottlingRateLimit: !Ref AiThrottleRate

  AiUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: quota_key
          AttributeType: S
      KeySchema:
        - AttributeName: quota_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  RoofGridApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: app.lambda_handler
      Description: RoofGrid server-side API proxy
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref RoofGridSecretArn
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${AiModel}
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt AiUsageTable.Arn
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/health
            Method: GET
        Ai:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/ai
            Method: POST
        Groq:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/groq
            Method: POST
        Contact:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/contact
            Method: POST
        Nasa:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/nasa
            Method: GET
        Overpass:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/overpass
            Method: GET

Outputs:
  ApiUrl:
    Description: Base URL used for the Amplify /api reverse proxy
    Value: !Sub https://${RoofGridHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  HealthUrl:
    Description: Health-check URL
    Value: !Sub https://${RoofGridHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/health
