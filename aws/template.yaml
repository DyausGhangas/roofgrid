AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RoofGrid API for AWS Lambda and API Gateway

Parameters:
  RoofGridSecretArn:
    Type: String
    Description: ARN of a Secrets Manager secret containing GROQ_API_KEY and CONTACT_EMAIL
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Browser origin allowed to call the API directly
  AiProvider:
    Type: String
    Default: groq
  AiModel:
    Type: String
    Default: openai/gpt-oss-120b

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 25
    Environment:
      Variables:
        ROOFGRID_SECRET_ARN: !Ref RoofGridSecretArn
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        AI_PROVIDER: !Ref AiProvider
        AI_MODEL: !Ref AiModel

Resources:
  RoofGridHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600

  RoofGridApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: app.lambda_handler
      Description: RoofGrid server-side API proxy
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref RoofGridSecretArn
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/health
            Method: GET
        Ai:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/ai
            Method: POST
        Groq:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/groq
            Method: POST
        Contact:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/contact
            Method: POST
        Nasa:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/nasa
            Method: GET
        Overpass:
          Type: HttpApi
          Properties:
            ApiId: !Ref RoofGridHttpApi
            Path: /api/overpass
            Method: GET

Outputs:
  ApiUrl:
    Description: Base URL used for the Amplify /api reverse proxy
    Value: !Sub https://${RoofGridHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  HealthUrl:
    Description: Health-check URL
    Value: !Sub https://${RoofGridHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/health
