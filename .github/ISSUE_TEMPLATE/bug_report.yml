name: Bug report
description: Report a reproducible problem in RoofGrid
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping us improve RoofGrid. Please search existing issues before submitting a new report.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the address or test location only when it is safe to share publicly.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the deployment, browser version, operating system, and device type.
      placeholder: "Deployment: AWS | Browser: Chrome 140 | OS: Windows 11 | Device: desktop"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Add useful screenshots or sanitized logs. Remove credentials, private addresses, and personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched the existing issues for duplicates.
          required: true
        - label: I removed credentials and personal information from the report.
          required: true
